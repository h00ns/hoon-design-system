name: Release

# main 에 changeset 이 쌓이면 "chore: release" PR 을 만들고(버전·CHANGELOG 갱신),
# 그 PR 이 머지되면 npm 에 배포한다.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changesets v3 의 출력 형식이 바뀌어 action 이 배포 여부를 인식하지 못하고
      # 태그 푸시·GitHub 릴리스 생성을 건너뛴다. 배포 직후(남은 changeset 이 없을 때) 직접 만든다.
      - name: 태그 푸시 · GitHub 릴리스 생성
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin --tags
          for tag in $(git tag --points-at HEAD); do
            gh release view "$tag" >/dev/null 2>&1 && continue
            pkg="${tag%@*}"
            ver="${tag##*@}"
            dir="packages/${pkg#@hoon-ds/}"
            notes=$(awk -v v="## $ver" '$0==v{f=1;next} /^## /{if(f)exit} f' "$dir/CHANGELOG.md")
            gh release create "$tag" --title "$tag" --notes "${notes:-$tag}"
          done
